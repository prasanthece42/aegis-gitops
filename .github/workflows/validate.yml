name: Validate Helm chart

on:
  pull_request:
    branches: [main, staging, prod]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main, staging, prod]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for explicit bot-created PR validation
        type: string
        default: ''

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Helm and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/aegis-tools"
          cd "$RUNNER_TEMP/aegis-tools"
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz --output helm.tar.gz
          echo 'c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3  helm.tar.gz' | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          mv linux-amd64/helm helm
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz --output kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz' | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          echo "$RUNNER_TEMP/aegis-tools" >> "$GITHUB_PATH"
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Lint, render, validate schemas, and reject unsafe inputs
        run: bash scripts/validate-chart.sh

  promotion-policy:
    name: promotion-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Test trusted policy code
        run: |
          ruff check .
          ruff format --check .
          python -m pytest
      - name: Validate release lineage and current-head approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            python scripts/promotion.py check-pr "$PR_NUMBER" "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'Explicit PR validation requires a PR number' >&2
            exit 1
          else
            echo 'Push validation: policy tests passed; PR review was checked before merge'
          fi
