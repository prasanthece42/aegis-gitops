name: Propose validated release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        default: dev
      release_tag:
        description: Source release tag (DEV only; blank selects latest)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-proposals
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Open a digest-preserving release PR and dispatch its checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=(propose "$TARGET_ENV")
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--release-tag "$RELEASE_TAG"); fi
          python scripts/promotion.py "${args[@]}"
