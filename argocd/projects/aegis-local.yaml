apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-local
  namespace: argocd
spec:
  description: Local Aegis DEV workload only
  sourceRepos:
    - git@github.com:prasanthece42/aegis-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: aegis-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
