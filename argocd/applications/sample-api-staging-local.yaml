apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-staging-local
  namespace: argocd
spec:
  project: aegis-staging
  source:
    repoURL: https://github.com/prasanthece42/aegis-gitops.git
    targetRevision: staging
    path: charts/sample-api
    helm:
      releaseName: sample-api
      valueFiles:
      - ../../environments/staging/values.yaml
      - ../../environments/cluster-kind/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis-staging
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        aegis.io/environment: staging
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.35
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.35
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.35
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - PruneLast=true
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
